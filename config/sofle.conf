# config/sofle.conf

# Explicitly enable USB and Bluetooth (Usually default, but safe to force)
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_BT=y

# Explicitly DISABLE the OLED displays
CONFIG_ZMK_DISPLAY=n

# Disable RGB Underglow and Backlight to isolate matrix testing
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n
